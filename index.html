  'UF-20260911-009': ["Colored pencil", "Orange, gray, teal", "Moderate", "Soft textured shading", "Curved vertical crescent with a small tail", "Bending"],
  'UF-20260911-010': ["Colored pencil", "Purple, lavender", "Moderate", "Shaded core with loose outer loops", "Core with surrounding loops", "Radiating from center"],
  'UF-20260911-011': ["Colored pencil", "Red, orange", "Dense", "Soft textured shading", "Single vertical oval", "Radiating from center"],
  'UF-20260911-012': ["Colored pencil", "Blue-violet", "Dense", "Soft textured shading", "Single vertical oval", "Contained"],
  'UF-20260911-013': ["Colored pencil", "Brown-gray", "Moderate", "Looping lines over shading", "Vertical tangled cluster", "Tangled"],
  'UF-20260911-014': ["Colored pencil", "Yellow-green", "Dense", "Dense looping lines", "Single round tangled mass", "Circling"],
  'UF-20260911-015': ["Colored pencil", "Salmon pink, olive, crimson", "Moderate", "Loose looping lines with a cross-shaped core", "Cross-shaped core inside loops", "Radiating from center"],
  'UF-20260912-001': ["Colored pencil", "Navy blue, gray", "Dense", "Soft textured shading", "Single irregular mass", "Contained"],
  'UF-20260912-002': ["Colored pencil", "Pink, coral, orange", "Moderate", "Loose textured hatching", "Single centered mass", "Dissolving at edges"],
  'UF-20260912-003': ["Colored pencil", "Pink, mauve, gray", "Moderate", "Loose looping lines over shading", "Vertical cluster", "Tangled"],
  'UF-20260912-004': ["Colored pencil + graphite", "Orange, brown, gray", "Moderate", "Soft textured shading", "Oval mass with a small trail below", "Drifting"],
  'UF-20260912-005': ["Colored pencil + pen", "Yellow-green, pink, brown, purple, black", "Dense", "Shading with small inked circles", "Large mass with circles along one edge", "Overlapping"],
  'UF-20260912-006': ["Graphite pencil", "Gray, black", "Dense", "Dense scribble with a loose looping edge", "Single centered mass", "Radiating from center"],
  'UF-20260912-007': ["Pen", "Crimson", "Sparse", "Loose wandering lines", "Open tangled form", "Wandering"],
  'UF-20260912-008': ["Pen", "Crimson, black", "Moderate", "Overlapping circular loops", "Overlapping circles", "Orbiting"],
  'UF-20260914-001': ["Graphite pencil", "Gray", "Moderate", "Shading wrapped in vertical loops", "Horizontal capsule wrapped in loops", "Wrapped"],
  'UF-20260914-002': ["Graphite pencil", "Gray", "Moderate", "Soft textured shading", "Single vertical oval", "Contained"],
  'UF-20260914-003': ["Graphite pencil", "Gray", "Dense", "Lacy looping texture with holes", "Single round mass", "Open"],
  'UF-20260914-004': ["Graphite pencil", "Gray", "Dense", "Soft blurred texture", "Single round mass", "Dissolving at edges"],
  'UF-20260914-005': ["Graphite pencil", "Gray", "Sparse", "Small looping marks", "Ring of small loops with an empty center", "Hollow"]
};

/* ========== helpers ========== */
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const parse = s => { const [y,mo,d] = s.split('-').map(Number); return new Date(y, mo-1, d); };
const fmtShort = s => s.split('-').reverse().join('.');
const fmtLong = s => { const d = parse(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const f = (r, i) => (FORM[r.id] && FORM[r.id][i]) || null;
const m = (r, k) => (META[r.id] && META[r.id][k] != null) ? META[r.id][k] : null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => (n < 10 ? '0' : '') + n;

// words ignored when finding shared words
const STOP = new Set('a an the of to in on at by for with and or but i im me my mine myself is are am was be been it its this that these those so from yet not no oh ah what who how why when where could should would will can do does did going go really very up down out more most little bit like again here there some someone within before through came come get getting got itll right let just all any about into over under too than then also us we you your yes now one another lead'.split(' '));
// words with the same root count as one word (feel / feeling, happy / happily)
const ROOTS = { brighter: 'bright', brighten: 'bright', darken: 'dark', happiness: 'happy', happily: 'happy' };
const FORMS = {};
// same spelling, different meaning: leave these words out for these records
// '*' leaves out every word (titles of songs or products, not the artist's own words)
const NOT_SHARED = { 'UF-20260910-002': ['still'], 'UF-20260909-001': ['*'], 'UF-20260908-006': ['*'], 'UF-20260908-002': ['hymn', 'weekend'] };
const rootOf = w => {
  if (ROOTS[w]) return ROOTS[w];
  let r = w;
  if (/ily$/.test(r) && r.length > 5) r = r.slice(0, -3) + 'y';
  else if (/ly$/.test(r) && r.length > 5) r = r.slice(0, -2);
  else if (/ness$/.test(r) && r.length > 6) r = r.slice(0, -4);
  else if (/ment$/.test(r) && r.length > 7) r = r.slice(0, -4);
  else if (/ing$/.test(r) && r.length > 5) { r = r.slice(0, -3); if (/([b-df-hj-np-tv-z])\1$/.test(r) && !/(ll|ss)$/.test(r)) r = r.slice(0, -1); }
  else if (/ed$/.test(r) && r.length > 5) r = r.slice(0, -2);
  return ROOTS[r] || r;
};
const wordsOf = s => {
  if (!s) return [];
  const out = [];
  s.toLowerCase().replace(/\u2019/g, "'").replace(/'s\b/g, '').replace(/'/g, '').split(/[^a-z]+/).forEach(w => {
    if (w.length > 3 && /s$/.test(w) && !/(ss|us|is)$/.test(w)) w = w.slice(0, -1);
    if (w.length < 2 || STOP.has(w)) return;
    const r = rootOf(w);
    (FORMS[r] = FORMS[r] || []).includes(w) || FORMS[r].push(w);
    if (!out.includes(r)) out.push(r);
  });
  return out;
};
const labelOf = r => (FORMS[r] || [r]).slice().sort((a, b) => a.length - b.length).join(' / ').toUpperCase();

// exact repetition key (case and spacing only), never semantic matching
// records without a sentence never group together
const norm = r => r.sentence ? r.sentence.trim().replace(/\s+/g, ' ').toLowerCase() : '__none__' + r.id;
const counts = {}; RECORDS.forEach(r => { const k = norm(r); counts[k] = (counts[k] || 0) + 1; });
const seen = {};
const recs = RECORDS.map((r, i) => {
  const k = norm(r); seen[k] = (seen[k] || 0) + 1;
  return { ...r, sentence: r.sentence || '', hasSentence: !!r.sentence, sid: r.sid || 'Not recorded', words: wordsOf(r.sentence).filter(w => { const ns = NOT_SHARED[r.id] || []; return !ns.includes('*') && !ns.includes(w); }), i, key: k, total: counts[k], occ: `${seen[k]} / ${counts[k]}` };
});

// shared-word classes: records whose sentences contain the same word
// (lowercase, plural "s" and possessive "'s" removed, common small words ignored)
const byWord = {};
recs.forEach(r => r.words.forEach(w => (byWord[w] = byWord[w] || []).push(r)));
const wordGroups = (() => {
  const sets = {};
  Object.keys(byWord).forEach(w => {
    const rs = byWord[w]; if (rs.length < 2) return;
    const k = rs.map(r => r.i).join(',');
    (sets[k] = sets[k] || { words: [], items: rs }).words.push(w);
  });
  return Object.values(sets).sort((a, b) => b.items.length - a.items.length || (a.words[0] < b.words[0] ? -1 : 1));
})();
const inWordGroup = new Set(wordGroups.flatMap(g => g.items.map(r => r.i)));

/* ========== state ========== */
const state = { view: 'grid', q: '', repOnly: false, desc: false, open: null };
const app = document.getElementById('app');
const set = patch => { Object.assign(state, patch); render(); };

/* ========== views ========== */
function cell(r, showCap = true) {
  return `<button class="cell" data-open="${r.i}" aria-label="Open record ${esc(r.id)}: ${esc(r.sentence)}">
    <div class="frame"><img src="${esc(r.img)}" alt="Drawing ${esc(r.id)}" loading="lazy"></div>
    ${showCap ? `<div class="cap"><span>${esc(r.id)}</span><span class="d">${fmtShort(r.date)}</span><span class="s">${esc(r.sentence)}</span></div>` : ''}
  </button>`;
}
function row(r) {
  return `<button class="row" data-open="${r.i}">
    <img src="${esc(r.img)}" alt="Drawing ${esc(r.id)}" loading="lazy">
    <span class="t"><b>${esc(r.sentence)}</b><i>${esc(r.id)}</i></span>
    <span class="meta"><span>${esc(r.sid)}</span><span>${fmtShort(r.date)}</span><span style="color:var(--mute)">OCC. ${r.occ}</span></span>
  </button>`;
}

function indexView() {
  const q = state.q.trim().toLowerCase();
  const matchQ = r => !q || r.sentence.toLowerCase().includes(q) || r.id.toLowerCase().includes(q);
  const order = list => state.desc ? list.slice().reverse() : list;
  // sections: by date normally, by shared word in REPEATED
  const sections = [];
  if (state.repOnly) {
    // exact repeats of the same sentence first, then shared words
    const done = new Set();
    recs.forEach(r => {
      if (r.total < 2 || done.has(r.key)) return;
      done.add(r.key);
      const list = order(recs.filter(x => x.key === r.key).filter(matchQ));
      if (list.length) sections.push({ title: '\u201c' + r.sentence + '\u201d', sub: 'same sentence', list });
    });
    wordGroups.forEach(g => {
      const list = order(g.items.filter(matchQ));
      if (list.length) sections.push({ title: g.words.map(labelOf).join(' · '), sub: 'shared word', list });
    });
  } else {
    const byDate = {};
    recs.filter(matchQ).forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));
    order(Object.keys(byDate).sort()).forEach(date => {
      const d = parse(date);
      sections.push({ title: `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`, sub: DAYS[d.getDay()], list: order(byDate[date]) });
    });
  }

  let body = '';
  if (!sections.length) {
    body = `<p class="empty">${state.repOnly ? 'No shared words match this search.' : 'No records match this search.'}</p>`;
  } else {
    sections.forEach(({ title, sub, list }) => {
      body += `<div class="dayhead">
        <h2>${esc(title)} <span>${esc(sub)}</span></h2>
        <span class="count">${pad2(list.length)} ${list.length === 1 ? 'RECORD' : 'RECORDS'}</span></div>`;
      body += state.view === 'grid'
        ? `<div class="grid">${list.map(r => cell(r)).join('')}</div>`
        : `<div class="list">${list.map(row).join('')}</div>`;
    });
  }

  return `<section>
    <div class="hero">
      <h1><button data-reset aria-label="Show all records in original order">UNNAMED FEELINGS</button></h1>
      <p>The Anatomy of Unnamed Feelings</p>
    </div>
    <div class="bar">
      <label><span class="k">SEARCH</span><input id="q" type="text" placeholder="Sentence or record ID" value="${esc(state.q)}"></label>
      <div class="pair"><span class="k">SORT</span><button class="tog on" data-sort>${state.desc ? 'REVERSE CHRONOLOGICAL' : 'CHRONOLOGICAL'}</button></div>
      <button class="tog ${state.repOnly ? 'on' : ''}" data-rep aria-pressed="${state.repOnly}">REPEATED</button>
      <div class="pair" style="gap:16px">
        <button class="tog ${state.view === 'grid' ? 'on' : ''}" data-view="grid">GRID</button>
        <button class="tog ${state.view === 'list' ? 'on' : ''}" data-view="list">LIST</button>
      </div>
    </div>
    ${body}
  </section>`;
}

function detailView() {
  const n = recs.length, r = recs[state.open];
  const same = recs.filter(x => x.key === r.key && x.i !== r.i);
  const sameDay = recs.filter(x => x.date === r.date && x.i !== r.i);
  const groups = FIELDS.map(g => `<div>
    <div class="ghead"><span>${g.title}</span><span>${g.kind}</span></div>
    ${g.rows.map(([no, k, fn]) => { const v = fn(r);
      return `<div class="mrow"><span class="n">${no}</span><span class="k">${k}</span><span class="${v == null ? 'nr' : ''}">${esc(v == null ? 'Not recorded' : v)}</span></div>`; }).join('')}
  </div>`).join('');

  return `<section>
    <div class="dnav">
      <button data-home>← INDEX</button>
      <span><button data-go="-1">PREVIOUS</button><span style="color:rgba(0,0,0,.45)">${r.i + 1} / ${n}</span><button data-go="1">NEXT</button></span>
    </div>
    <div class="detail">
      <div class="frame"><img src="${esc(r.img)}" alt="Drawing ${esc(r.id)}"></div>
      <div class="dside">
        <div class="dtitle">
          <span style="font-size:12px;letter-spacing:.06em">${esc(r.id)}</span>
          <h1>${esc(r.sentence)}</h1>
          <span style="color:var(--mute)">${fmtLong(r.date)}</span>
        </div>
        ${groups}
      </div>
    </div>
    <div class="block">
      <h2>OTHER INTERPRETATIONS OF THE SAME SENTENCE</h2>
      ${same.length ? `<div class="grid">${same.map(x => cell(x)).join('')}</div>`
        : `<p>This sentence has been recorded once. Other records will appear here if it reoccurs.</p>`}
    </div>
    ${(() => {
      const ws = r.words.map(w => ({ w, others: byWord[w].filter(x => x.i !== r.i) })).filter(g => g.others.length);
      return ws.length ? `<div class="block"><h2>RECORDS SHARING A WORD</h2>${ws.map(g =>
        `<div class="ghead" style="margin-top:20px;font-size:12px;letter-spacing:.06em"><span>${esc(labelOf(g.w))}</span><span>${pad2(g.others.length + 1)} RECORDS</span></div><div class="grid">${g.others.map(x => cell(x)).join('')}</div>`).join('')}</div>` : '';
    })()}
    ${sameDay.length ? `<div class="block"><h2>SAME DATE · DIFFERENT RECORDS</h2><div class="grid">${sameDay.map(x => cell(x)).join('')}</div></div>` : ''}
  </section>`;
}

function render() {
  app.innerHTML = state.open === null ? indexView() : detailView();
  const q = document.getElementById('q');
  if (q && state._focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

/* ========== events ========== */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-home')) { set({ open: null }); window.scrollTo(0, 0); }
  else if (t.dataset.open != null) { set({ open: Number(t.dataset.open) }); window.scrollTo(0, 0); }
  else if (t.dataset.view) set({ view: t.dataset.view });
  else if (t.hasAttribute('data-rep')) set({ repOnly: !state.repOnly });
  else if (t.hasAttribute('data-sort')) set({ desc: !state.desc });
  else if (t.hasAttribute('data-reset')) { set({ view: 'grid', q: '', repOnly: false, desc: false, open: null }); window.scrollTo(0, 0); }
  else if (t.dataset.go) { const n = recs.length; set({ open: (state.open + Number(t.dataset.go) + n) % n }); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { state._focusQ = true; set({ q: e.target.value }); state._focusQ = false; }
});

render();
</script>
</body>
